<div class="container">
  <h1 class="title">Color Text Demo</h1>
  <div class="controls">
    <div class="control-group">
      <label for="color-input" class="label">Text Color</label>
      <div class="color-row">
        <input
          id="color-input"
          class="color-input"
          type="color"
          value="#f00030"
        /><span class="color-hex">#f00030</span>
      </div>
    </div>
    <div class="control-group">
      <label for="text-input" class="label">Your Text</label
      ><input
        id="text-input"
        placeholder="Type something..."
        class="text-input"
        type="text"
        value="Hello React"
      />
    </div>
  </div>
  <div class="display-box">
    <p class="display-text" style="color: rgb(240, 0, 48)">Hello React</p>
  </div>
</div>
